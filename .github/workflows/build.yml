name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode keystore
        working-directory: washdog-native
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > washdog-release.jks

      - name: Write local.properties
        working-directory: washdog-native
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anonKey=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "signing.storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "signing.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "signing.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Lint
        working-directory: washdog-native
        run: ./gradlew lint

      - name: Unit tests
        working-directory: washdog-native
        run: ./gradlew test

      - name: Assemble release APK
        working-directory: washdog-native
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: washdog-release
          path: washdog-native/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Washdog v1.0.${{ github.run_number }}"
          files: washdog-native/app/build/outputs/apk/release/app-release.apk
          body: |
            APK firmado — build #${{ github.run_number }}
